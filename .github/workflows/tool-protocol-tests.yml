name: Tool protocol tests

on:
  pull_request:
    paths:
      - app.py
      - test_tool_protocol.py
      - .github/workflows/tool-protocol-tests.yml
  push:
    branches:
      - fix/hermes-tool-calls-streaming

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest -v test_tool_protocol.py
        env:
          REPLICATE_API_TOKEN: test
          REPLICATE_VERSION: test
